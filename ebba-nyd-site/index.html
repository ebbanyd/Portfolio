
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Ebba Nyd — Industrial Designer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #f7f6f3;
  --ink: #20201e;
  --muted: #797873;
  --line: #deddd7;
  --box: #e5e3de;
  --pad: clamp(22px, 4vw, 68px);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Libre Caslon Condensed", Georgia, serif;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
}

body.locked {
  overflow: hidden;
}

a {
  text-decoration: none;
  color: inherit;
}

button {
  font: inherit;
}

img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* FLOATING HEADER */

.site-header {
  position: fixed;
  z-index: 20;
  top: 22px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 44px);
  max-width: 1500px;
  height: 76px;
  border-radius: 100px;

  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;

  padding: 0 38px;
  color: #fff;
  background: transparent;
  border: 1px solid transparent;

  transition:
    background .45s ease,
    color .45s ease,
    box-shadow .45s ease,
    border-color .45s ease,
    top .45s ease,
    opacity .3s ease;
}

.site-header.scrolled {
  top: 14px;
  color: var(--ink);
  background: #fff;
  border-color: rgba(0,0,0,.035);
  box-shadow: 0 6px 35px rgba(0,0,0,.065);
}

.header-left,
.header-right {
  display: flex;
  align-items: center;
  gap: 26px;
}

.header-right {
  justify-content: flex-end;
}

.site-header nav a {
  font-size: 17px;
  transition: opacity .2s;
}

.site-header a:hover {
  opacity: .6;
}

/* CENTER LOGO PLACEHOLDER */

.brand {
  grid-column: 2;
  justify-self: center;
  display: flex;
  justify-content: center;
  align-items: center;
  min-width: 145px;
  height: 100%;
}

.brand-placeholder {
  font-family: "Libre Caslon Condensed", Georgia, serif;
  font-size: clamp(25px, 2.3vw, 37px);
  font-weight: 600;
  letter-spacing: -.045em;
  line-height: 1;
  white-space: nowrap;
}

.brand img {
  display: block;
  width: auto;
  height: 42px;
  max-width: 230px;
  object-fit: contain;
}

/* White placeholder switches automatically
   to dark when the navigation becomes white. */

.site-header.scrolled .brand-placeholder {
  color: var(--ink);
}

/* Hide landing navigation on project pages */

body.locked .site-header {
  opacity: 0;
  pointer-events: none;
}

/* HERO VIDEO */

.hero {
  position: relative;
  height: 100svh;
  min-height: 550px;
  overflow: hidden;
  background: #55524d;
  color: white;
}

.hero-video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,.24) 0%,
    rgba(0,0,0,.03) 45%,
    rgba(0,0,0,.4) 100%
  );
}

.hero-content {
  position: absolute;
  bottom: 11%;
  left: var(--pad);
  right: var(--pad);
  z-index: 2;
}

.hero-content h1 {
  font-size: clamp(65px, 10vw, 165px);
  font-weight: 400;
  letter-spacing: -.045em;
  line-height: .95;
}

.hero-content p {
  margin-top: 24px;
  font-size: clamp(17px, 1.8vw, 26px);
}

.scroll-down {
  position: absolute;
  bottom: 36px;
  right: var(--pad);
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 17px;
}

.scroll-down span {
  font-size: 25px;
}

/* INTRO */

.intro {
  padding: 125px var(--pad);
  display: grid;
  grid-template-columns: 1fr 2fr;
  gap: 60px;
  border-bottom: 1px solid var(--line);
}

.eyebrow {
  font-size: 17px;
  letter-spacing: .025em;
}

.intro h2 {
  font-size: clamp(36px, 4.2vw, 65px);
  font-weight: 400;
  letter-spacing: -.025em;
  line-height: 1.15;
  max-width: 850px;
}

/* SELECTED WORK */

.projects {
  padding: 100px var(--pad) 130px;
}

.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 48px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 25px;
}

.section-heading h2 {
  font-size: clamp(32px, 3.8vw, 54px);
  font-weight: 400;
  letter-spacing: -.025em;
}

.section-heading span {
  font-size: 17px;
  color: var(--muted);
}

.project-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 75px 24px;
}

.project-card {
  display: block;
  min-width: 0;
}

.project-card .media {
  aspect-ratio: 4 / 5;
  background: var(--box);
  overflow: hidden;
}

.project-card .media img {
  transition: transform .8s cubic-bezier(.2,.7,.2,1);
}

.project-card:hover img {
  transform: scale(1.035);
}

.project-meta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 20px;
  padding-top: 19px;
}

.project-meta h3 {
  font-size: clamp(23px, 2vw, 33px);
  font-weight: 400;
  letter-spacing: -.025em;
}

.project-meta span,
.project-category {
  font-size: 16px;
  color: var(--muted);
}

.project-category {
  margin-top: 8px;
}

/* INFORMATION */

.information {
  background: #eae9e4;
  padding: 110px var(--pad) 60px;
}

.information-top,
.information-bottom {
  display: grid;
  grid-template-columns: 1fr 2fr;
  gap: 60px;
}

.information-top {
  padding-bottom: 110px;
}

.information h2 {
  font-size: 19px;
  font-weight: 400;
}

.about-text {
  font-size: clamp(30px, 3.4vw, 52px);
  line-height: 1.25;
  letter-spacing: -.02em;
  max-width: 850px;
  white-space: pre-line;
}

.information-bottom {
  border-top: 1px solid #c9c7c0;
  padding: 55px 0 110px;
}

.contact-list {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 16px;
}

.contact-list a {
  font-size: clamp(25px, 2.5vw, 38px);
  transition: opacity .2s;
}

.contact-list a:hover {
  opacity: .5;
}

footer {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  padding-top: 28px;
  border-top: 1px solid #c9c7c0;
  color: var(--muted);
  font-size: 16px;
}

/* PROJECT DETAIL PAGE */

.project-page {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: var(--bg);
  overflow-y: auto;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity .35s, visibility .35s;
}

.project-page.open {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}

.project-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 3;
  background: var(--bg);
  padding: 24px var(--pad);
  border-bottom: 1px solid var(--line);
  font-size: 19px;
}

.project-top button {
  border: none;
  background: none;
  color: inherit;
  cursor: pointer;
}

.project-top button:hover {
  opacity: .5;
}

.project-hero {
  height: min(82vh, 950px);
  background: var(--box);
  overflow: hidden;
}

.project-body {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 75px;
  padding: 100px var(--pad);
}

.project-body h1 {
  font-size: clamp(50px, 7vw, 110px);
  font-weight: 400;
  letter-spacing: -.04em;
  line-height: 1;
}

.project-body dl {
  display: grid;
  grid-template-columns: 80px 1fr;
  gap: 12px 25px;
  margin-top: 35px;
  font-size: 18px;
}

.project-body dt {
  color: var(--muted);
}

.project-description {
  font-size: clamp(20px, 1.9vw, 26px);
  line-height: 1.55;
  max-width: 650px;
  white-space: pre-line;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px;
  padding: 0 var(--pad) 100px;
}

.gallery-item {
  background: var(--box);
  aspect-ratio: 4 / 3;
  overflow: hidden;
}

.gallery-item:nth-child(3n) {
  grid-column: 1 / -1;
  aspect-ratio: 16 / 9;
}

.next-project {
  display: block;
  border-top: 1px solid var(--line);
  padding: 80px var(--pad) 100px;
  font-size: clamp(40px, 5.5vw, 85px);
  letter-spacing: -.025em;
  transition: opacity .2s;
}

.next-project small {
  display: block;
  margin-bottom: 20px;
  color: var(--muted);
  font-size: 17px;
  letter-spacing: 0;
}

.next-project:hover {
  opacity: .55;
}

.fill {
  width: 100%;
  height: 100%;
  background: var(--box);
}

/* REVEAL EFFECT */

.reveal {
  opacity: 0;
  transform: translateY(25px);
  transition: opacity .9s ease, transform .9s ease;
}

.reveal.in {
  opacity: 1;
  transform: none;
}

/* MOBILE */

@media (max-width: 720px) {

  .site-header {
    top: 10px;
    width: calc(100% - 20px);
    height: 65px;
    padding: 0 19px;
  }

  .site-header.scrolled {
    top: 10px;
  }

  .site-header nav a {
    font-size: 14px;
  }

  .header-left,
  .header-right {
    gap: 12px;
  }

  .brand {
    min-width: 90px;
  }

  .brand-placeholder {
    font-size: 23px;
  }

  .brand img {
    height: 34px;
    max-width: 115px;
  }

  .hero-content {
    bottom: 15%;
  }

  .hero-content h1 {
    font-size: clamp(55px, 13vw, 100px);
  }

  .scroll-down {
    bottom: 25px;
    left: var(--pad);
    right: auto;
  }

  .intro {
    padding: 80px var(--pad);
    grid-template-columns: 1fr;
    gap: 28px;
  }

  .projects {
    padding: 80px var(--pad);
  }

  .project-grid {
    grid-template-columns: 1fr;
    gap: 48px;
  }

  .information {
    padding-top: 75px;
  }

  .information-top,
  .information-bottom {
    grid-template-columns: 1fr;
    gap: 25px;
  }

  .information-top,
  .information-bottom {
    padding-bottom: 75px;
  }

  .project-hero {
    height: 55vh;
  }

  .project-body {
    grid-template-columns: 1fr;
    gap: 35px;
    padding: 65px var(--pad);
  }

  .gallery {
    grid-template-columns: 1fr;
    gap: 15px;
    padding-bottom: 65px;
  }

  .gallery-item:nth-child(3n) {
    grid-column: auto;
    aspect-ratio: 4 / 3;
  }

  footer {
    flex-direction: column;
  }
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  *,
  *::before,
  *::after {
    transition: none !important;
  }

  .reveal {
    opacity: 1;
    transform: none;
  }
}
</style>
</head>

<body>

<!-- FIXED FLOATING NAVIGATION -->

<header class="site-header" id="site-header">

  <nav class="header-left">
    <a href="#work">Work</a>
  </nav>

  <a href="#" class="brand" id="logo">
    <span class="brand-placeholder">EBBA NYD</span>
  </a>

  <nav class="header-right">
    <a href="#about">About</a>
    <a href="#contact" id="nav-contact">Contact</a>
  </nav>

</header>

<main>

  <!-- FULL SCREEN VIDEO -->

  <section class="hero" id="home">

    <video
      class="hero-video"
      autoplay
      muted
      loop
      playsinline
      aria-hidden="true"
    >
      <source src="images/intro.mp4" type="video/mp4">
    </video>

    <div class="hero-content">
      <h1 id="name"></h1>
      <p id="title"></p>
    </div>

    <a href="#work" class="scroll-down">
      Explore work <span>↓</span>
    </a>

  </section>

  <!-- INTRODUCTION -->

  <section class="intro">
    <div class="eyebrow">Portfolio / Industrial Design</div>

    <h2>
      Exploring the relationship between
      form, function and everyday life.
    </h2>
  </section>

  <!-- SELECTED PROJECTS -->

  <section class="projects" id="work">

    <div class="section-heading">
      <h2>Selected Work</h2>
      <span id="count"></span>
    </div>

    <div class="project-grid" id="project-grid"></div>

  </section>

  <!-- INFORMATION -->

  <section class="information" id="about">

    <div class="information-top">
      <h2>About</h2>
      <p class="about-text" id="about-text"></p>
    </div>

    <div class="information-bottom" id="contact">
      <h2>Get in touch</h2>
      <div class="contact-list" id="contact-list"></div>
    </div>

    <footer>
      <span id="footer"></span>
      <span>Industrial Design Portfolio</span>
      <a href="#home">Back to top ↑</a>
    </footer>

  </section>

</main>

<!-- PROJECT DETAIL PAGE -->

<article
  class="project-page"
  id="project"
  aria-hidden="true"
  inert
></article>

<script src="content.js"></script>

<script>

if (typeof SITE === "undefined") {
  document.body.innerHTML =
    '<div style="padding:50px;font-family:Georgia;">' +
    'Something in content.js has a typo. ' +
    'Check for a missing comma or quotation mark.' +
    '</div>';

  throw new Error("content.js failed to load");
}

const $ = id => document.getElementById(id);

const esc = value =>
  String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[char]));

const slug = value =>
  String(value)
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-|-$/g, "");

const media = (src, alt, lazy = true) =>
  src
    ? `<img src="${esc(src)}" alt="${esc(alt)}" ${lazy ? 'loading="lazy"' : ''}>`
    : '<div class="fill"></div>';

const projects = SITE.projects || [];

/* BASIC CONTENT */

document.title = SITE.name + " — Industrial Designer";

$("name").textContent = SITE.name;
$("title").textContent = SITE.title;
$("about-text").textContent = SITE.about || "";

$("footer").textContent =
  "© " + new Date().getFullYear() + " " + SITE.name;

$("count").textContent =
  projects.length + " Projects";

/* FLOATING HEADER SCROLL BEHAVIOR */

const header = $("site-header");

function updateHeader() {
  if (window.scrollY > 60) {
    header.classList.add("scrolled");
  } else {
    header.classList.remove("scrolled");
  }
}

window.addEventListener(
  "scroll",
  updateHeader,
  { passive: true }
);

updateHeader();

/* CONTACT */

const contact = SITE.contact || {};

const links = [
  contact.email &&
    `<a href="mailto:${esc(contact.email)}">${esc(contact.email)}</a>`,

  contact.instagram &&
    `<a href="${esc(contact.instagram)}" target="_blank" rel="noopener noreferrer">Instagram ↗</a>`,

  contact.linkedin &&
    `<a href="${esc(contact.linkedin)}" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>`
].filter(Boolean);

if (links.length) {
  $("contact-list").innerHTML = links.join("");
} else {
  $("contact").remove();
  $("nav-contact").remove();
}

/* PROJECT CARDS */

$("project-grid").innerHTML = projects.map(p => `
  <a class="project-card reveal" href="#${slug(p.title)}">

    <div class="media">
      ${media(p.cover, p.title)}
    </div>

    <div class="project-meta">
      <h3>${esc(p.title)}</h3>
      <span>${esc(p.year)}</span>
    </div>

    ${p.category
      ? `<div class="project-category">${esc(p.category)}</div>`
      : ""
    }

  </a>
`).join("");

/* PROJECT DETAIL PAGE */

const page = $("project");
let lastScroll = 0;

function openProject(index) {

  const p = projects[index];
  const next = projects[(index + 1) % projects.length];

  const facts = [
    ["Year", p.year],
    ["Type", p.category]
  ].filter(item => item[1]);

  page.innerHTML = `

    <div class="project-top">
      <button id="close-project">← Back to work</button>
      <span>${index + 1} / ${projects.length}</span>
    </div>

    <div class="project-hero">
      ${media(p.cover, p.title, false)}
    </div>

    <div class="project-body">

      <div>
        <h1>${esc(p.title)}</h1>

        ${facts.length
          ? `<dl>${facts.map(item => `
              <dt>${item[0]}</dt>
              <dd>${esc(item[1])}</dd>
            `).join("")}</dl>`
          : ""
        }
      </div>

      <div class="project-description">
        ${esc(p.text)}
      </div>

    </div>

    ${(p.images || []).length
      ? `<div class="gallery">
          ${p.images.map(src => `
            <div class="gallery-item">
              ${media(src, p.title)}
            </div>
          `).join("")}
        </div>`
      : ""
    }

    ${projects.length > 1
      ? `<a class="next-project" href="#${slug(next.title)}">
          <small>Next project</small>
          ${esc(next.title)} →
        </a>`
      : ""
    }

  `;

  $("close-project").onclick = () => {
    location.hash = "work";
  };

  page.scrollTop = 0;
  page.classList.add("open");
  page.setAttribute("aria-hidden", "false");
  page.inert = false;
  document.body.classList.add("locked");
}

function closeProject() {

  if (!page.classList.contains("open")) {
    return false;
  }

  page.classList.remove("open");
  page.setAttribute("aria-hidden", "true");
  page.inert = true;
  document.body.classList.remove("locked");

  return true;
}

/* HASH NAVIGATION */

function route() {

  const hash = decodeURIComponent(
    location.hash.slice(1)
  );

  const index = projects.findIndex(
    p => slug(p.title) === hash
  );

  if (index >= 0) {

    if (!page.classList.contains("open")) {
      lastScroll = window.scrollY;
    }

    openProject(index);

  } else if (closeProject()) {

    window.scrollTo(0, lastScroll);

  }
}

window.addEventListener("hashchange", route);

window.addEventListener("keydown", event => {
  if (
    event.key === "Escape" &&
    page.classList.contains("open")
  ) {
    location.hash = "work";
  }
});

route();

/* SCROLL ANIMATIONS */

const revealItems = document.querySelectorAll(
  ".reveal, .intro, .section-heading"
);

if ("IntersectionObserver" in window) {

  const observer = new IntersectionObserver(entries => {

    entries.forEach(entry => {

      if (entry.isIntersecting) {
        entry.target.classList.add("in");
        observer.unobserve(entry.target);
      }

    });

  }, {
    threshold: 0.08
  });

  revealItems.forEach(element => {
    element.classList.add("reveal");
    observer.observe(element);
  });

} else {

  revealItems.forEach(element => {
    element.classList.add("in");
  });

}

/* ACCESSIBILITY */

if (window.matchMedia(
  "(prefers-reduced-motion: reduce)"
).matches) {

  const video = document.querySelector(".hero-video");

  if (video) {
    video.pause();
  }

}

</script>

</body>
</html>
